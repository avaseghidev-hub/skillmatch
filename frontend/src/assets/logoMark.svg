<svg width="120" height="140" viewBox="0 0 200 260" xmlns="http://www.w3.org/2000/svg">
  <style>
    .left { fill: var(--logo-left); }
    .right { fill: var(--logo-right); }
    .text-dark { fill: var(--logo-left); }
    .text-light { fill: var(--logo-right); }
    .handle { 
      stroke: var(--logo-left);
      stroke-width: 12;
    }
  </style>

  <!-- Handle -->
  <path
    d="M70 48 Q70 18 100 18 Q130 18 130 48"
    fill="none"
    stroke-linecap="round"
    class="handle"
  />

  <!-- Left suitcase -->
  <path
    d="M20 65 Q20 45 42 45 H100 V145 H42 Q20 145 20 123 Z"
    class="left"
  />

  <!-- Right suitcase -->
  <path
    d="M100 45 H158 Q180 45 180 65 V123 Q180 145 158 145 H100 Z"
    class="right"
  />

  <!-- Puzzle holes -->
  <circle cx="100" cy="88" r="13" fill="white"/>
  <circle cx="100" cy="112" r="13" class="right"/>

  <!-- Text (centered under icon) -->
  <text
    x="100"
    y="200"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="36"
    font-weight="600"
  >
    <tspan class="text-dark">Skill</tspan>
    <tspan class="text-light">Match</tspan>
  </text>
</svg>