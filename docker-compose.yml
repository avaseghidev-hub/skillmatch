services:
  postgres:
    image: postgres:16
    container_name: skillmatch-postgres

    environment:
      POSTGRES_DB: skillmatch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend

    container_name: skillmatch-backend

    depends_on:
      - postgres

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/skillmatch
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234

    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend

    container_name: skillmatch-frontend

    depends_on:
      - backend

    ports:
      - "3000:80"

volumes:
  postgres_data: